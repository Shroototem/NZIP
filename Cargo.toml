[workspace]
resolver = "3"
members = ["crates/bsc-sys", "crates/bwtc", "crates/ncore", "crates/nzip", "crates/nzip-cli", "crates/mixlab", "crates/unpack"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
panic = "abort"

[profile.test]
opt-level = 2
