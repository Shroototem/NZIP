[package]
name = "nzip"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Universal lossless compressor: integer-only context mixing with an online neural mixer, deterministic on every CPU"

[features]
# dev only: reads the NZ_* / NZIP_* environment switches (tuning, tracing, forced code
# paths). NZ_K overrides model constants, so its archives need the same values to decode.
tune = []

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

[profile.test]
opt-level = 3
