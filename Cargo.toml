[package]
name = "nzip"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Universal lossless compressor: integer-only context mixing with an online neural mixer, deterministic on every CPU"

[features]
# dev only: lets NZ_K override model constants (archives then need the same values)
tune = []

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

[profile.test]
opt-level = 3
